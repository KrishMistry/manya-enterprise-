        /* ==========================================================================
         * 3. SECURITY & SANITIZATION UTILITIES
         * ========================================================================== */
        const RATE_LIMIT_KEY = 'me_sec_rl_inquiry';
        const MAX_ATTEMPTS = 5;
        const WINDOW_MS = 5 * 60 * 1000;

        function escapeHtml(str) {
          if (str === null || str === undefined) return '';
          return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function sanitizeText(input, maxLength) {
          if (!input || typeof input !== 'string') return '';
          const limit = maxLength || 2000;
          const trimmed = input.slice(0, limit);
          const withoutDangerousTags = trimmed
            .replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '')
            .replace(/<iframe\b[^<]*(?:(?!<\/iframe>)<[^<]*)*<\/iframe>/gi, '')
            .replace(/<object\b[^<]*(?:(?!<\/object>)<[^<]*)*<\/object>/gi, '')
            .replace(/<embed\b[^<]*(?:(?!<\/embed>)<[^<]*)*<\/embed>/gi, '')
            .replace(/javascript:/gi, '')
            .replace(/vbscript:/gi, '')
            .replace(/onload\s*=/gi, '')
            .replace(/onerror\s*=/gi, '')
            .replace(/onclick\s*=/gi, '');

          return withoutDangerousTags
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#x27;')
            .trim();
        }

        function sanitizeHeaderField(input, maxLength) {
          if (!input || typeof input !== 'string') return '';
          const limit = maxLength || 150;
          return input
            .replace(/[\r\n\t\f\v]/g, ' ')
            .replace(/[<>"'`;=]/g, '')
            .slice(0, limit)
            .trim();
        }

        function isValidEmail(email) {
          if (!email || typeof email !== 'string') return false;
          if (email.length > 254) return false;
          if (/[\r\n\s]/.test(email)) return false;
          const emailRegex = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+$/;
          return emailRegex.test(email);
        }

        function isValidPhone(phone) {
          if (!phone || typeof phone !== 'string') return false;
          if (phone.length < 8 || phone.length > 20) return false;
          const phoneRegex = /^\+?[0-9\s\-()]{8,20}$/;
          return phoneRegex.test(phone);
        }

        function checkRateLimit() {
          try {
            const raw = localStorage.getItem(RATE_LIMIT_KEY);
            const now = Date.now();
            let history = raw ? JSON.parse(raw) : [];
            history = history.filter(function (ts) { return typeof ts === 'number' && now - ts < WINDOW_MS; });
            if (history.length >= MAX_ATTEMPTS) {
              const oldest = Math.min.apply(null, history);
              const retryAfterSeconds = Math.ceil((oldest + WINDOW_MS - now) / 1000);
              return {
                allowed: false,
                remainingAttempts: 0,
                retryAfterSeconds: Math.max(1, retryAfterSeconds)
              };
            }
            return {
              allowed: true,
              remainingAttempts: MAX_ATTEMPTS - history.length,
              retryAfterSeconds: 0
            };
          } catch (e) {
            return { allowed: true, remainingAttempts: MAX_ATTEMPTS, retryAfterSeconds: 0 };
          }
        }

        function recordRateLimitAttempt() {
          try {
            const raw = localStorage.getItem(RATE_LIMIT_KEY);
            const now = Date.now();
            let history = raw ? JSON.parse(raw) : [];
            history = history.filter(function (ts) { return typeof ts === 'number' && now - ts < WINDOW_MS; });
            history.push(now);
            localStorage.setItem(RATE_LIMIT_KEY, JSON.stringify(history));
          } catch (e) {}
        }

        function isHumanTiming(mountTimestamp, minSeconds) {
          const elapsed = (Date.now() - mountTimestamp) / 1000;
          return elapsed >= (minSeconds || 1.5);
        }

        async function submitInquiryToBackend(data) {
          if (window.location.protocol === 'file:') {
            return { success: false, message: 'Standalone file mode' };
          }
          try {
            const response = await fetch('/api/inquiries', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
              },
              body: JSON.stringify(data)
            });
            return await response.json();
          } catch (err) {
            return {
              success: false,
              message: 'Backend logging offline or unreachable',
              error: err && err.message ? err.message : 'Network error'
            };
          }
        }

        function refreshFormContainer(prefix, compact) {
          const container = document.querySelector('[data-form-container="' + prefix + '"]');
          if (!container) return;
          const initialService = container.getAttribute('data-initial-service') || 'ETP Plant Setup';
          container.innerHTML = renderInquiryFormMarkup(prefix, initialService, compact);
          bindFormEvents(container);
        }

        function startCooldownTimer(prefix, compact) {
          const fs = getFormState(prefix);
          if (fs.cooldownTimer) clearInterval(fs.cooldownTimer);
          fs.cooldownTimer = setInterval(function () {
            if (fs.rateLimitCooldown <= 1) {
              clearInterval(fs.cooldownTimer);
              fs.cooldownTimer = null;
              fs.rateLimitCooldown = 0;
              fs.errorMsg = null;
            } else {
              fs.rateLimitCooldown -= 1;
            }
            refreshFormContainer(prefix, compact);
          }, 1000);
        }

        function bindFormEvents(scope) {
          const forms = (scope || document).querySelectorAll('.inquiry-form-el');
          forms.forEach(function (formEl) {
            const prefix = formEl.getAttribute('data-prefix');
            const compact = formEl.getAttribute('data-compact') === '1';
            const fs = getFormState(prefix);

            // Live input updates without re-rendering DOM
            formEl.querySelectorAll('input, select, textarea').forEach(function (field) {
              const eventName = field.tagName === 'SELECT' ? 'change' : 'input';
              field.addEventListener(eventName, function (e) {
                const name = e.target.name;
                const val = e.target.value;
                if (name === 'security_bot_trap') {
                  fs.botTrap = val;
                } else if (name in fs.formData) {
                  fs.formData[name] = val;
                }
                fs.errorMsg = null;
              });
            });

            // Submit handler
            formEl.addEventListener('submit', function (e) {
              e.preventDefault();
              fs.errorMsg = null;

              if (fs.botTrap && fs.botTrap.trim().length > 0) {
                fs.errorMsg = 'Automated submission rejected. Bot activity detected.';
                refreshFormContainer(prefix, compact);
                return;
              }

              if (!isHumanTiming(fs.mountTime, 1.2)) {
                fs.errorMsg = 'Submission rejected: Form was completed unnaturally fast. Please review your details.';
                refreshFormContainer(prefix, compact);
                return;
              }

              const rateCheck = checkRateLimit();
              if (!rateCheck.allowed) {
                fs.rateLimitCooldown = rateCheck.retryAfterSeconds;
                fs.errorMsg = 'Anti-abuse protection active: Too many inquiries submitted in a short time. Please wait ' + rateCheck.retryAfterSeconds + 's before submitting again.';
                refreshFormContainer(prefix, compact);
                startCooldownTimer(prefix, compact);
                return;
              }

              const cleanFullName = sanitizeHeaderField(fs.formData.fullName, 80);
              const cleanCompany = sanitizeHeaderField(fs.formData.companyName || '', 100);
              const cleanPhone = sanitizeHeaderField(fs.formData.phoneNumber, 25);
              const cleanEmail = sanitizeHeaderField(fs.formData.emailAddress, 100);
              const cleanMessage = sanitizeText(fs.formData.message || '', 2000);
              const cleanCapacity = sanitizeHeaderField(fs.formData.plantCapacity || '', 80);
              const cleanCity = sanitizeHeaderField(fs.formData.locationCity || '', 80);
              const cleanUrgency = sanitizeHeaderField(fs.formData.urgencyLevel || '', 80);

              if (!cleanFullName) {
                fs.errorMsg = 'Please enter your full name (letters and spaces only).';
                refreshFormContainer(prefix, compact);
                return;
              }
              if (!cleanPhone || !isValidPhone(cleanPhone)) {
                fs.errorMsg = 'Please provide a valid contact phone or WhatsApp number (minimum 8 digits, e.g. +91 99983 78352).';
                refreshFormContainer(prefix, compact);
                return;
              }
              if (!cleanEmail || !isValidEmail(cleanEmail)) {
                fs.errorMsg = 'Please enter a valid, secure corporate email address (e.g. name@company.com).';
                refreshFormContainer(prefix, compact);
                return;
              }

              fs.loading = true;
              refreshFormContainer(prefix, compact);

              const safeFormData = {
                fullName: cleanFullName,
                companyName: cleanCompany,
                phoneNumber: cleanPhone,
                emailAddress: cleanEmail,
                serviceRequired: fs.formData.serviceRequired,
                message: cleanMessage,
                plantCapacity: cleanCapacity,
                locationCity: cleanCity,
                urgencyLevel: cleanUrgency
              };

              recordRateLimitAttempt();

              submitInquiryToBackend(safeFormData).then(function (res) {
                if (res && res.success && res.data && res.data.inquiryId) {
                  fs.inquiryId = res.data.inquiryId;
                  if (fs.submitted) {
                    refreshFormContainer(prefix, compact);
                  }
                }
              });

              const freshMail = buildInquiryEmailContent(safeFormData, {
                plantCapacity: cleanCapacity,
                locationCity: cleanCity,
                urgencyLevel: cleanUrgency
              });

              try {
                window.location.href = freshMail.mailtoUrl;
              } catch (err) {}

              fs.formData = safeFormData;

              setTimeout(function () {
                fs.loading = false;
                fs.submitted = true;
                refreshFormContainer(prefix, compact);
              }, 600);
            });
          });

          // Toggle advanced specs
          (scope || document).querySelectorAll('[data-toggle-advanced]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              const prefix = btn.getAttribute('data-toggle-advanced');
              const fs = getFormState(prefix);
              fs.showAdvanced = !fs.showAdvanced;
              const container = document.querySelector('[data-form-container="' + prefix + '"]');
              const compact = container && container.getAttribute('data-compact') === '1';
              refreshFormContainer(prefix, compact);
            });
          });

          // Copy inquiry summary
          (scope || document).querySelectorAll('[data-copy-inquiry]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              const prefix = btn.getAttribute('data-copy-inquiry');
              const fs = getFormState(prefix);
              const mail = buildInquiryEmailContent(fs.formData, {
                plantCapacity: fs.formData.plantCapacity,
                locationCity: fs.formData.locationCity,
                urgencyLevel: fs.formData.urgencyLevel
              });
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(mail.bodyText);
              }
              fs.copied = true;
              const container = document.querySelector('[data-form-container="' + prefix + '"]');
              const compact = container && container.getAttribute('data-compact') === '1';
              refreshFormContainer(prefix, compact);
              setTimeout(function () {
                fs.copied = false;
                refreshFormContainer(prefix, compact);
              }, 2500);
            });
          });

          // Reset form
          (scope || document).querySelectorAll('[data-reset-inquiry]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              const prefix = btn.getAttribute('data-reset-inquiry');
              const container = document.querySelector('[data-form-container="' + prefix + '"]');
              const initialService = (container && container.getAttribute('data-initial-service')) || 'ETP Plant Setup';
              const compact = container && container.getAttribute('data-compact') === '1';
              const fs = getFormState(prefix, initialService);
              fs.submitted = false;
              fs.inquiryId = null;
              fs.botTrap = '';
              fs.mountTime = Date.now();
              fs.errorMsg = null;
              fs.formData = {
                fullName: '',
                companyName: '',
                phoneNumber: '',
                emailAddress: '',
                serviceRequired: initialService,
                message: '',
                plantCapacity: '',
                locationCity: '',
                urgencyLevel: 'Normal (Within 24-48 Hours)'
              };
              refreshFormContainer(prefix, compact);
            });
          });
        }

              mainEl.innerHTML = renderWhyChooseUsPage();
              break;
            case 'contact':
              mainEl.innerHTML = renderContactPage();
              bindFormEvents(mainEl);
              break;
            default:
              mainEl.innerHTML = renderHomePage();
          }
        }

        /* ==========================================================================
         * 8. GLOBAL EVENT DELEGATION & INITIALIZATION
         * ========================================================================== */
        document.addEventListener('click', function (e) {
          const navTarget = e.target.closest('[data-nav]');
          if (navTarget) {
            e.preventDefault();
            navigateTo(navTarget.getAttribute('data-nav'));
            return;
          }

          const svcTarget = e.target.closest('[data-select-service]');
          if (svcTarget) {
            e.preventDefault();
            selectServiceFromHome(svcTarget.getAttribute('data-select-service'));
            return;
          }

          const inqTarget = e.target.closest('[data-open-inquiry]');
          if (inqTarget) {
            e.preventDefault();
            openInquiryModal(inqTarget.getAttribute('data-open-inquiry'));
            return;
          }
        });

        window.addEventListener('scroll', function () {
          const scrolled = window.scrollY > 20;
          if (scrolled !== state.isScrolled) {
            state.isScrolled = scrolled;
            const navEl = document.getElementById('main-navbar');
            if (navEl) {
              if (scrolled) {
                navEl.className = 'w-full transition-all duration-300 bg-slate-950/95 backdrop-blur-md shadow-lg border-b border-slate-800/80 py-3.5';
              } else {
                navEl.className = 'w-full transition-all duration-300 bg-slate-900 border-b border-slate-800 py-4';
              }
            }
          }
        });

        // Initial Render
        hydrateStaticIcons(document);
        syncDocumentTitle();
        renderNavbar();
        renderMain();
        renderFooter();
      })();
    </script>
  </body>
</html>
